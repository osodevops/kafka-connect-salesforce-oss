name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
      tag_name:
        description: 'Git tag (defaults to v<version>)'
        required: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      tag_name:
        type: string
        required: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        run: |
          VERSION="${{ inputs.version || github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "Refusing to release a SNAPSHOT version: $VERSION" >&2
            exit 1
          fi
          TAG="${{ inputs.tag_name }}"
          [ -z "$TAG" ] && TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Verify checked-in version matches the release
        run: |
          POM_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [ "$POM_VERSION" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "pom.xml version $POM_VERSION != release ${{ steps.resolve.outputs.version }}" >&2
            exit 1
          fi

      - name: Build and test
        run: mvn clean verify --batch-mode --no-transfer-progress

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag_name }}

      - name: Set up JDK 17 for publishing
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Deploy to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME || secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN || secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn clean deploy \
            --batch-mode \
            --no-transfer-progress \
            -Prelease \
            -DskipTests

      - name: Attach connector plugin ZIPs to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag_name }}
          files: |
            **/target/*-kafka-connect-plugin.zip
