name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn clean verify --batch-mode --no-transfer-progress

      # The configuration reference is generated from each connector's ConfigDef during the
      # build; fail if the committed pages are stale.
      - name: Check generated configuration reference is committed
        run: git diff --exit-code -- website/docs/reference/configuration

      - name: Upload connector plugin ZIPs
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: connect-plugin-zips
          path: '**/target/*-kafka-connect-plugin.zip'
          retention-days: 14

      # Executable proof that the documented Confluent cutover procedure loses no
      # events — regenerated by ConfluentCutoverMigrationTest on every build.
      - name: Upload migration evidence report
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: migration-evidence
          path: connect-salesforce-source/target/migration-evidence.json
          retention-days: 90

      # Platform event record contract (JsonConverter rendering) and the Connect-cluster run
      # (real worker in docker, offsets via REST, task restart without duplicates).
      - name: Upload platform event evidence reports
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: platform-event-evidence
          path: |
            connect-salesforce-source/target/platform-event-evidence.json
            e2e-tests/target/platform-event-e2e-evidence.json
          retention-days: 90
