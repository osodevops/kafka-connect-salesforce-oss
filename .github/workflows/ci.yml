name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn clean verify --batch-mode --no-transfer-progress

      - name: Upload connector plugin ZIPs
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: connect-plugin-zips
          path: '**/target/*-kafka-connect-plugin.zip'
          retention-days: 14

      # Executable proof that the documented Confluent cutover procedure loses no
      # events — regenerated by ConfluentCutoverMigrationTest on every build.
      - name: Upload migration evidence report
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: migration-evidence
          path: connect-salesforce-source/target/migration-evidence.json
          retention-days: 90
